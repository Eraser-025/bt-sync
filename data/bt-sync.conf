# Configuration of bt-sync (read by the root backend).

[bt-sync]
# If a Bluetooth LE device connects after syncing but loses the pairing after
# a while, try reversing the byte order of the Identity Resolving Key: some
# Windows versions store it reversed.
reverse_irk = false

# How many backups of the Windows SYSTEM registry hive to keep in
# /var/lib/bt-sync/backups (one is made before every write to Windows).
keep_backups = 5
