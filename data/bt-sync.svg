<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- fondo scuro: l'icona resta leggibile sia su pannelli chiari che scuri -->
  <circle cx="32" cy="32" r="31" fill="#1c2230" stroke="#ffffff" stroke-opacity="0.28" stroke-width="1.5"/>

  <!-- freccia 1 (ciano): arco superiore, in senso orario -->
  <g fill="#22d3ee" stroke="#22d3ee">
    <path d="M10.25 21.86 A24 24 0 0 1 53.75 21.86" fill="none" stroke-width="5"/>
    <polygon points="59.19,19.32 48.31,24.40 57.55,30.02" stroke="none"/>
  </g>

  <!-- freccia 2 (verde lime): stessa forma ruotata di 180 gradi -->
  <g fill="#a3e635" stroke="#a3e635" transform="rotate(180 32 32)">
    <path d="M10.25 21.86 A24 24 0 0 1 53.75 21.86" fill="none" stroke-width="5"/>
    <polygon points="59.19,19.32 48.31,24.40 57.55,30.02" stroke="none"/>
  </g>

  <!-- simbolo Bluetooth bianco -->
  <g transform="translate(32 32) scale(1.1) translate(-32 -32)">
    <path d="M22 24 L42 40 L32 48 L32 16 L42 24 L22 40"
          fill="none" stroke="#ffffff" stroke-width="4.4"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
